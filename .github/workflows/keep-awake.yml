# Keeps the free Render instance from sleeping: it sleeps after ~15 minutes without requests.
# GitHub may delay scheduled runs, and pauses them after 60 days without repository activity.
name: keep-awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Request /health
        # Never fails the run: a sleeping or redeploying server is not an error worth an email.
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://arcane-academies.onrender.com/health || true)
          echo "health: ${code:-no answer}"
