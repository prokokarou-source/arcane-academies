# Render blueprint: one free web service that runs the game server and serves the web client.
services:
  - type: web
    name: arcane-academies
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Neon Postgres connection string for accounts and friends; set it in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      # Web Push (invite / friend-request notifications). Generate with `npm run vapid`; push is off until all three are set.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      # Contact for push services, e.g. mailto:you@example.com
      - key: VAPID_SUBJECT
        sync: false
      # Encrypts the admin's authenticator secret; the hidden /admin page is off without it (see docs/admin.md).
      - key: ADMIN_KEY
        generateValue: true
